name: i_care
description: "Shared care for an older relative: medications, doses, stock and appointments, coordinated between caregivers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.13.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/OFL-AtkinsonHyperlegibleNext.txt

  # Bundled so text never waits on (or leaks visits to) a font server.
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700

# App icon: a hand holding a heart. Edit tool/icon/icare.svg, then run
# tool/icon/render.sh to redraw the PNGs and regenerate these.
flutter_launcher_icons:
  image_path: tool/icon/full.png
  ios: true
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "#1E6A64"
  adaptive_icon_foreground: tool/icon/fg.png
  web:
    generate: true
    image_path: tool/icon/full.png
    background_color: "#F2F5F4"
    theme_color: "#1E6A64"
